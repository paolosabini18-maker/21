<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario</title>
<style>
  :root{
    --bg:#F6F4FA;
    --surface:#FFFFFF;
    --ink:#1C1730;
    --ink-soft:#5C5470;
    --purple:#5B3A8E;
    --purple-dark:#3B2560;
    --purple-light:#EDE6F7;
    --accent:#8B6FC4;
    --line:#E1D9F0;
    --warn:#B8860B;
    --warn-bg:#FBF2DC;
    --danger:#B23A48;
    --danger-bg:#FBE7E9;
    --success:#3E8E5C;
    --success-bg:#E7F5EC;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:var(--sans); background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  header.top{
    background:var(--purple-dark); color:#fff; padding:18px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    border-bottom:3px dashed var(--accent);
  }
  header.top .brandwrap{display:flex; align-items:center; gap:10px;}
  header.top .tagicon{
    width:22px; height:22px; border:2px solid #fff; border-radius:4px 4px 4px 0;
    position:relative; transform:rotate(-45deg); flex:none;
  }
  header.top .tagicon::after{
    content:''; position:absolute; top:4px; left:4px; width:5px; height:5px;
    border-radius:50%; background:#fff;
  }
  header.top .brand{
    font-size:19px; font-weight:700; letter-spacing:.3px; outline:none; border-bottom:1px dashed rgba(255,255,255,.4);
    padding:2px 4px; min-width:80px;
  }
  header.top .sub{font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--accent); font-weight:600;}
  header.top .meta{font-size:12px; color:#D8CDEE; font-family:var(--mono);}
  .filebar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .filebar .btn-small{ padding:6px 10px; font-size:11.5px; }
  .filebar #fileStatusText{ padding:4px 0; cursor:pointer; }
  .filebar #fileStatusText.ok{ color:#B9F5CE; }
  .filebar #fileStatusText.warn{ color:#F5D98A; }
  .filebar #fileStatusText.err{ color:#F5AEB4; }

  nav.tabbar{
    display:flex; gap:2px; padding:0 20px; background:var(--purple); overflow-x:auto;
  }
  nav.tabbar button{
    background:transparent; border:none; color:#E5DBF5; padding:13px 18px; font-size:13px;
    font-weight:600; letter-spacing:.4px; cursor:pointer; text-transform:uppercase; white-space:nowrap;
    border-bottom:3px solid transparent; font-family:var(--sans);
  }
  nav.tabbar button.active{ color:#fff; border-bottom:3px solid #fff; background:var(--purple-dark); }
  nav.tabbar button:hover:not(.active){ background:var(--purple-dark); color:#fff; }

  main{ padding:22px; max-width:1280px; margin:0 auto; }
  .panel{ display:none; }
  .panel.active{ display:block; }

  .panel-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:16px; }
  .panel-head h2{ margin:0; font-size:20px; letter-spacing:.2px; }
  .panel-head .eyebrow{ font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--accent); font-weight:700; margin-bottom:4px; display:block;}

  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .toolbar input[type=text], .toolbar select{
    padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px; background:#fff; color:var(--ink);
    font-family:var(--sans);
  }

  .btn{
    border:none; padding:9px 15px; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer;
    font-family:var(--sans); display:inline-flex; align-items:center; gap:6px;
  }
  .btn-primary{ background:var(--purple); color:#fff; }
  .btn-primary:hover{ background:var(--purple-dark); }
  .btn-ghost{ background:var(--purple-light); color:var(--purple-dark); }
  .btn-ghost:hover{ background:#E1D2F5; }
  .btn-danger{ background:var(--danger-bg); color:var(--danger); }
  .btn-danger:hover{ background:#F6D5D9; }
  .btn-small{ padding:5px 10px; font-size:12px; border-radius:5px; }
  .btn:disabled{ opacity:.3; cursor:not-allowed; }
  .actions-cell{ white-space:nowrap; }
  .actions-cell .btn{ padding:5px 8px; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{
    background:var(--purple); color:#fff; text-align:left; padding:10px 12px; font-weight:600;
    font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; position:sticky; top:0;
  }
  tbody td{ padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr:hover{ background:var(--purple-light); }
  tbody tr:last-child td{ border-bottom:none; }
  td.num, th.num{ text-align:right; font-family:var(--mono); }
  td.mono{ font-family:var(--mono); font-size:12.5px; color:var(--ink-soft); }
  .table-scroll{ max-height:65vh; overflow:auto; }

  .badge{
    display:inline-block; padding:2px 9px 2px 14px; border-radius:3px 3px 3px 0; font-size:11px; font-weight:700;
    background:var(--purple-light); color:var(--purple-dark); position:relative; letter-spacing:.3px;
  }
  .badge::before{
    content:''; position:absolute; left:4px; top:50%; transform:translateY(-50%);
    width:4px; height:4px; border-radius:50%; background:var(--purple-dark);
  }
  .pill{ display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; }
  .pill-pend{ background:var(--warn-bg); color:var(--warn); }
  .pill-env{ background:var(--purple-light); color:var(--purple-dark); }
  .pill-ent{ background:var(--success-bg); color:var(--success); }
  .pill-canc{ background:var(--danger-bg); color:var(--danger); }
  .low-stock{ color:var(--danger); font-weight:700; }
  .neg-stock{ color:#fff; background:var(--danger); padding:1px 6px; border-radius:4px; font-weight:700;}

  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:12px; margin-bottom:20px; }
  .stat{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; border-top:3px solid var(--purple); }
  .stat .label{ font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft); font-weight:700; margin-bottom:6px;}
  .stat .value{ font-size:24px; font-weight:700; font-family:var(--mono); color:var(--purple-dark); }

  .two-col{ display:grid; grid-template-columns:1.3fr 1fr; gap:18px; align-items:start; }
  @media (max-width:900px){ .two-col{ grid-template-columns:1fr; } }

  .empty-state{ padding:40px 20px; text-align:center; color:var(--ink-soft); }
  .empty-state .dash{ font-family:var(--mono); font-size:12px; letter-spacing:2px; color:var(--accent); margin-bottom:6px; }

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(28,23,48,.55); z-index:50;
    align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto;
  }
  .modal-overlay.active{ display:flex; }
  .modal{
    background:#fff; border-radius:10px; width:100%; max-width:560px; padding:22px 24px 24px;
    border-top:4px dashed var(--accent);
  }
  .modal h3{ margin:0 0 4px; font-size:17px; }
  .modal .eyebrow{ font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--accent); font-weight:700; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 14px; margin-top:16px; }
  .form-grid .full{ grid-column:1/-1; }
  .field label{ display:block; font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-bottom:4px; text-transform:uppercase; letter-spacing:.4px;}
  .field input, .field select{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; font-size:13.5px;
    font-family:var(--sans); background:#FBFAFD; color:var(--ink);
  }
  .field input:focus, .field select:focus{ outline:2px solid var(--accent); background:#fff; }
  .field.inline-add{ display:flex; gap:6px; align-items:flex-end; }
  .field.inline-add select{ flex:1; }
  .readout{ background:var(--purple-light); border-radius:8px; padding:10px 12px; margin-top:4px; font-size:13px; }
  .readout b{ font-family:var(--mono); color:var(--purple-dark); }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .hint{ font-size:11.5px; color:var(--ink-soft); margin-top:3px; }
  .warn-text{ font-size:11.5px; color:var(--warn); margin-top:3px; font-weight:600; }

  .section-title{ font-size:13px; font-weight:700; margin:0 0 10px; text-transform:uppercase; letter-spacing:.5px; color:var(--purple-dark); }
</style>
</head>
<body>

<header class="top">
  <div class="brandwrap">
    <div class="tagicon"></div>
    <div>
      <span class="sub">Panel de inventario</span><br>
      <span class="brand" id="brandName" contenteditable="true" spellcheck="false">Mi Marca</span>
    </div>
  </div>
  <div class="filebar">
    <span class="meta" id="fileStatusText">Guardado en el navegador (local)</span>
    <button class="btn btn-ghost btn-small" id="btnConnectFile">📁 Guardar en archivo local</button>
    <button class="btn btn-ghost btn-small" id="btnExportBackup" title="Descarga una copia .json de todos tus datos">⬇ Exportar copia</button>
    <button class="btn btn-ghost btn-small" id="btnImportBackup" title="Reemplaza los datos actuales por los de un archivo .json exportado antes">⬆ Importar copia</button>
    <input type="file" id="importFileInput" accept=".json" style="display:none">
  </div>
</header>

<nav class="tabbar">
  <button class="tab-btn active" data-tab="inventario">1. Inventario</button>
  <button class="tab-btn" data-tab="ventas">2. Ventas</button>
  <button class="tab-btn" data-tab="resumenVentas">3. Resumen ventas</button>
  <button class="tab-btn" data-tab="resumenGeneral">4. Resumen general</button>
</nav>

<main>

  <!-- INVENTARIO -->
  <section class="panel active" id="panel-inventario">
    <div class="panel-head">
      <div><span class="eyebrow">Productos</span><h2>Inventario</h2></div>
      <button class="btn btn-primary" id="btnNuevoProducto">+ Nuevo producto</button>
    </div>
    <div class="toolbar">
      <input type="text" id="invSearch" placeholder="Buscar por producto, talle, color...">
      <select id="invCategoriaFilter"><option value="">Todas las categorías</option></select>
    </div>
    <div class="card">
      <div class="table-scroll" id="invTableWrap"></div>
    </div>
  </section>

  <!-- VENTAS -->
  <section class="panel" id="panel-ventas">
    <div class="panel-head">
      <div><span class="eyebrow">Pedidos</span><h2>Ventas</h2></div>
      <button class="btn btn-primary" id="btnNuevaVenta">+ Nueva venta</button>
    </div>
    <div class="toolbar">
      <input type="text" id="ventaSearch" placeholder="Buscar por cliente, N° pedido, producto...">
      <select id="ventaEstadoFilter">
        <option value="">Todos los estados</option>
        <option>Pendiente</option><option>Enviado</option><option>Entregado</option><option>Cancelado</option>
      </select>
    </div>
    <div class="card">
      <div class="table-scroll" id="ventasTableWrap"></div>
    </div>
  </section>

  <!-- RESUMEN VENTAS -->
  <section class="panel" id="panel-resumenVentas">
    <div class="panel-head"><div><span class="eyebrow">Rendimiento</span><h2>Resumen de ventas</h2></div></div>
    <div class="stat-grid" id="statsVentas"></div>
    <div class="card" style="padding:16px;">
      <p class="section-title">Ventas por canal</p>
      <div id="canalTableWrap"></div>
    </div>
  </section>

  <!-- RESUMEN GENERAL -->
  <section class="panel" id="panel-resumenGeneral">
    <div class="panel-head"><div><span class="eyebrow">Estado general</span><h2>Resumen general</h2></div></div>
    <div class="stat-grid" id="statsGeneral"></div>
    <div class="two-col">
      <div class="card" style="padding:16px;">
        <p class="section-title">Stock por categoría</p>
        <div id="categoriaTableWrap"></div>
      </div>
      <div class="card" style="padding:16px;">
        <p class="section-title">Stock bajo (≤ 3 unidades)</p>
        <div id="lowStockWrap"></div>
      </div>
    </div>
  </section>

</main>

<!-- MODAL PRODUCTO -->
<div class="modal-overlay" id="productModalOverlay">
  <div class="modal">
    <span class="eyebrow" id="productModalEyebrow">Producto</span>
    <h3 id="productModalTitle">Nuevo producto</h3>
    <form id="productForm">
      <input type="hidden" id="p_id">
      <div class="form-grid">
        <div class="field inline-add">
          <div style="flex:1">
            <label>Categoría</label>
            <select id="p_categoria" required></select>
          </div>
          <button type="button" class="btn btn-ghost btn-small" id="btnAddCategoria">+ Nueva</button>
        </div>
        <div class="field"><label>Producto / Descripción</label><input type="text" id="p_descripcion" required placeholder="Ej: Campera oversize"></div>
        <div class="field"><label>Talle</label><input type="text" id="p_talle" required placeholder="S, M, 40..."></div>
        <div class="field"><label>Color</label><input type="text" id="p_color" required placeholder="Negro, beige..."></div>
        <div class="field"><label>Stock inicial</label><input type="number" id="p_stockInicial" min="0" required></div>
        <div class="field"><label>Stock actual</label><input type="number" id="p_stockActual" min="0" required></div>
        <div class="field"><label>Costo unitario ($)</label><input type="number" id="p_costo" min="0" step="0.01" required></div>
        <div class="field"><label>Precio de venta ($)</label><input type="number" id="p_precio" min="0" step="0.01" required></div>
      </div>
      <div class="readout" id="p_readout"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="btnCancelProduct">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar producto</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL VENTA -->
<div class="modal-overlay" id="saleModalOverlay">
  <div class="modal">
    <span class="eyebrow" id="saleModalEyebrow">Venta</span>
    <h3 id="saleModalTitle">Nueva venta</h3>
    <form id="saleForm">
      <input type="hidden" id="v_id">
      <div class="form-grid">
        <div class="field"><label>Fecha</label><input type="date" id="v_fecha" required></div>
        <div class="field"><label>N° de pedido</label><input type="text" id="v_pedido" required></div>
        <div class="field full"><label>Cliente</label><input type="text" id="v_cliente" required></div>
        <div class="field full">
          <label>Producto</label>
          <select id="v_producto" required></select>
          <div class="hint" id="v_stockHint"></div>
        </div>
        <div class="field"><label>Cantidad</label><input type="number" id="v_cantidad" min="1" value="1" required></div>
        <div class="field"><label>Precio unitario ($)</label><input type="number" id="v_precioUnitario" min="0" step="0.01" required></div>
        <div class="field"><label>Descuento ($)</label><input type="number" id="v_descuento" min="0" step="0.01" value="0"></div>
        <div class="field"><label>Envío ($)</label><input type="number" id="v_envio" min="0" step="0.01" value="0"></div>
        <div class="field"><label>Método de pago</label>
          <select id="v_metodo"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Mercado Pago</option><option>Otro</option></select>
        </div>
        <div class="field"><label>Estado</label>
          <select id="v_estado"><option>Pendiente</option><option>Enviado</option><option>Entregado</option><option>Cancelado</option></select>
        </div>
        <div class="field full"><label>Canal</label>
          <select id="v_canal"><option>Instagram</option><option>WhatsApp</option><option>Facebook</option><option>Web</option><option>Otro</option></select>
        </div>
      </div>
      <div class="readout" id="v_readout"></div>
      <div id="v_warn"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="btnCancelSale">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar venta</button>
      </div>
    </form>
  </div>
</div>

<script>
let inventory = [];
let sales = [];
let categories = [];
const DEFAULT_CATEGORIES = ['Abrigos','Pantalones','Remeras','Camisas','Vestidos','Buzos','Accesorios'];

// ---------- storage helpers ----------
// Usa window.storage cuando está disponible (vista previa dentro de Claude.ai).
// Si no existe (por ejemplo abriendo el archivo directo o vía WAMP/localhost),
// usa localStorage del navegador como respaldo, con la misma interfaz.
const STORAGE_PREFIX = 'inventario_marca_';
const hasClaudeStorage = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';

async function loadKey(key, fallback){
  try{
    if(hasClaudeStorage){
      const res = await window.storage.get(key, false);
      return res ? JSON.parse(res.value) : fallback;
    }
    const raw = localStorage.getItem(STORAGE_PREFIX+key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
async function saveKey(key, value){
  try{
    if(hasClaudeStorage){
      await window.storage.set(key, JSON.stringify(value), false);
    }else{
      localStorage.setItem(STORAGE_PREFIX+key, JSON.stringify(value));
    }
  }catch(e){ console.error('Error guardando', key, e); }
}
async function saveInventory(){ await saveKey('inventory', inventory); }
async function saveSales(){ await saveKey('sales', sales); }
async function saveCategories(){ await saveKey('categories', categories); }

// ---------- guardado en archivo local (File System Access API) ----------
let fileHandle = null;
const supportsFileSystem = 'showSaveFilePicker' in window;

function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('inventarioAppDB', 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore('handles');
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSetHandle(key, handle){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('handles','readwrite');
    tx.objectStore('handles').put(handle, key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function idbGetHandle(key){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('handles','readonly');
    const req = tx.objectStore('handles').get(key);
    req.onsuccess = ()=>resolve(req.result||null);
    req.onerror = ()=>reject(req.error);
  });
}

function setFileStatus(kind, name){
  const el = document.getElementById('fileStatusText');
  el.classList.remove('ok','warn','err');
  if(kind==='unsupported'){
    el.textContent = 'Tu navegador no permite vincular un archivo local · usá Exportar/Importar';
    el.classList.add('warn');
  }else if(kind==='none'){
    el.textContent = 'Guardado en el navegador (local) · sin archivo vinculado';
  }else if(kind==='needs-permission'){
    el.textContent = `Archivo "${name}" vinculado · tocá el botón para reactivar el guardado`;
    el.classList.add('warn');
  }else if(kind==='connected'){
    el.textContent = `Guardando en "${name}" en tu computadora ✓`;
    el.classList.add('ok');
  }else if(kind==='error'){
    el.textContent = 'No se pudo escribir en el archivo local · revisá permisos';
    el.classList.add('err');
  }
}

async function writeStateToFile(){
  if(!fileHandle) return;
  try{
    const perm = await fileHandle.queryPermission({mode:'readwrite'});
    if(perm!=='granted') return;
    const state = {
      inventory, sales, categories,
      brandName: brandEl.textContent.trim()||'Mi Marca',
      savedAt: new Date().toISOString()
    };
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(state, null, 2));
    await writable.close();
    setFileStatus('connected', fileHandle.name);
  }catch(e){
    console.error('Error escribiendo archivo local', e);
    setFileStatus('error');
  }
}

async function loadStateFromFile(){
  try{
    const file = await fileHandle.getFile();
    const text = await file.text();
    if(text.trim()){
      const state = JSON.parse(text);
      inventory = state.inventory||[];
      sales = state.sales||[];
      categories = (state.categories && state.categories.length) ? state.categories : DEFAULT_CATEGORIES.slice();
      brandEl.textContent = state.brandName||'Mi Marca';
    }
  }catch(e){ console.error('No se pudo leer el archivo local', e); }
}

async function connectLocalFile(){
  if(!supportsFileSystem){
    alert('Tu navegador no soporta vincular un archivo local directamente (esto funciona en Chrome o Edge). Usá los botones "Exportar copia" e "Importar copia" como alternativa.');
    return;
  }
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: 'inventario_datos.json',
      types: [{ description:'Datos del inventario', accept:{'application/json':['.json']} }]
    });
    fileHandle = handle;
    await idbSetHandle('dataFileHandle', handle);
    await writeStateToFile();
    setFileStatus('connected', handle.name);
  }catch(e){
    if(e.name!=='AbortError') console.error(e);
  }
}

async function tryReconnectFile(){
  if(!supportsFileSystem){ setFileStatus('unsupported'); return; }
  try{
    const handle = await idbGetHandle('dataFileHandle');
    if(!handle){ setFileStatus('none'); return; }
    const perm = await handle.queryPermission({mode:'readwrite'});
    if(perm==='granted'){
      fileHandle = handle;
      await loadStateFromFile();
      setFileStatus('connected', handle.name);
    }else{
      fileHandle = handle;
      setFileStatus('needs-permission', handle.name);
    }
  }catch(e){ console.error(e); setFileStatus('none'); }
}

async function reactivateFilePermission(){
  if(!fileHandle) return connectLocalFile();
  try{
    const perm = await fileHandle.requestPermission({mode:'readwrite'});
    if(perm==='granted'){
      await loadStateFromFile();
      await persistAll();
      setFileStatus('connected', fileHandle.name);
      populateCategorySelects(); populateProductSelectForSales();
      renderInventoryTable(); renderVentasTable();
    }
  }catch(e){ console.error(e); }
}

// ---------- exportar / importar copia manual ----------
function exportBackup(){
  const state = {
    inventory, sales, categories,
    brandName: brandEl.textContent.trim()||'Mi Marca',
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'inventario_backup_'+todayStr()+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
async function importBackupFile(file){
  try{
    const text = await file.text();
    const state = JSON.parse(text);
    if(!confirm('Esto va a reemplazar los datos actuales por los del archivo importado. ¿Continuar?')) return;
    inventory = state.inventory||[];
    sales = state.sales||[];
    categories = (state.categories && state.categories.length) ? state.categories : DEFAULT_CATEGORIES.slice();
    brandEl.textContent = state.brandName||'Mi Marca';
    await persistAll();
    populateCategorySelects(); populateProductSelectForSales();
    renderInventoryTable(); renderVentasTable();
    alert('Datos importados correctamente.');
  }catch(e){
    console.error(e);
    alert('El archivo no es válido o está dañado.');
  }
}

// ---------- utils ----------
function fmtMoney(n){
  n = Number(n)||0;
  return '$' + n.toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function nextId(prefix, list, field){
  let max = 0;
  list.forEach(it=>{
    const v = (it[field]||'');
    const m = v.match(new RegExp('^'+prefix+'(\\d+)$'));
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return prefix + String(max+1).padStart(3,'0');
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function computeProduct(p){
  const valorCostoTotal = p.costoUnitario * p.stockActual;
  const gananciaUnidad = p.precioVenta - p.costoUnitario;
  const gananciaTotalEstimada = gananciaUnidad * p.stockActual;
  return {valorCostoTotal, gananciaUnidad, gananciaTotalEstimada};
}

function populateCategorySelects(){

  formSel.innerHTML = categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  if(categories.includes(filterCurrent)) filterSel.value = filterCurrent;
  if(categories.includes(formCurrent)) formSel.value = formCurrent;
}

function renderInventoryTable(){
  const search = document.getElementById('invSearch').value.trim().toLowerCase();
  const catFilter = document.getElementById('invCategoriaFilter').value;
  let rows = inventory.filter(p=>{
    const matchesSearch = !search || [p.descripcion,p.talle,p.color,p.categoria,p.id].join(' ').toLowerCase().includes(search);
    const matchesCat = !catFilter || p.categoria===catFilter;
    return matchesSearch && matchesCat;
  });
  const wrap = document.getElementById('invTableWrap');
  if(inventory.length===0){
    wrap.innerHTML = `<div class="empty-state"><div class="dash">— — —</div>Todavía no cargaste productos.<br><br><button class="btn btn-primary" onclick="document.getElementById('btnNuevoProducto').click()">Cargar el primer producto</button></div>`;
    return;
  }
  if(rows.length===0){
    wrap.innerHTML = `<div class="empty-state"><div class="dash">— — —</div>No hay productos que coincidan con la búsqueda.</div>`;
    return;
  }
  let html = `<table><thead><tr>
    <th>ID</th><th>Categoría</th><th>Producto</th><th>Talle</th><th>Color</th>
    <th class="num">Stock inicial</th><th class="num">Stock actual</th><th class="num">Costo unit.</th>
    <th class="num">Valor costo total</th><th class="num">Precio venta</th><th class="num">Ganancia/u</th>
    <th class="num">Ganancia total est.</th><th></th>
  </tr></thead><tbody>`;
  rows.forEach(p=>{
    const c = computeProduct(p);
    const idx = inventory.indexOf(p);
    const isFirst = idx===0, isLast = idx===inventory.length-1;
    const stockCell = p.stockActual < 0 ? `<span class="neg-stock">${p.stockActual}</span>` : (p.stockActual<=3 ? `<span class="low-stock">${p.stockActual}</span>` : p.stockActual);
    html += `<tr>
      <td class="mono">${esc(p.id)}</td>
      <td><span class="badge">${esc(p.categoria)}</span></td>
      <td>${esc(p.descripcion)}</td>
      <td>${esc(p.talle)}</td>
      <td>${esc(p.color)}</td>
      <td class="num">${p.stockInicial}</td>
      <td class="num">${stockCell}</td>
      <td class="num">${fmtMoney(p.costoUnitario)}</td>
      <td class="num">${fmtMoney(c.valorCostoTotal)}</td>
      <td class="num">${fmtMoney(p.precioVenta)}</td>
      <td class="num">${fmtMoney(c.gananciaUnidad)}</td>
      <td class="num">${fmtMoney(c.gananciaTotalEstimada)}</td>
      <td class="actions-cell">
      <button class="btn btn-ghost btn-small" onclick="moveProduct('${p.id}',-1)" title="Subir" ${isFirst?'disabled':''}>↑</button>
      <button class="btn btn-ghost btn-small" onclick="moveProduct('${p.id}',1)" title="Bajar" ${isLast?'disabled':''}>↓</button>
      <button class="btn btn-ghost btn-small" onclick="duplicateProduct('${p.id}')" title="Duplicar">⧉</button>
      <button class="btn btn-ghost btn-small" onclick="editProduct('${p.id}')">Editar</button>
      <button class="btn btn-danger btn-small" onclick="deleteProduct('${p.id}')">Borrar</button></td>
    </tr>`;
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

async function deleteProduct(id){

  const msg = used ? '⚠ Este producto tiene ventas registradas. Si lo borrás, esas ventas quedarán sin referencia. ¿Borrar de todas formas?' : '¿Borrar este producto del inventario?';

async function moveProduct(id, direction){
  const idx = inventory.findIndex(p=>p.id===id);
  const newIdx = idx+direction;
  if(idx<0 || newIdx<0 || newIdx>=inventory.length) return;
  [inventory[idx], inventory[newIdx]] = [inventory[newIdx], inventory[idx]];
  await persistAll();
  renderInventoryTable();
}
async function duplicateProduct(id){
  const idx = inventory.findIndex(p=>p.id===id);
  if(idx<0) return;
  const copy = {...inventory[idx], id: nextId('P', inventory, 'id')};
  inventory.splice(idx+1, 0, copy);
  await persistAll();
  renderInventoryTable();
  populateProductSelectForSales();
}

async function deleteSale(id){
  if(!confirm('¿Borrar esta venta? El stock del producto se restituirá si correspondía.')) return;
  const s = sales.find(x=>x.id===id);
  if(s) applyStockDelta(s, +1);
  sales = sales.filter(x=>x.id!==id);
  await persistAll();
  renderVentasTable();
  renderInventoryTable();
}
function applyStockDelta(sale, sign){
  if(sale.estado === 'Cancelado') return;
  const item = inventory.find(i=>i.id===sale.productoId);
  if(item) item.stockActual += sign*sale.cantidad;
}
async function moveSale(id, direction){
  const idx = sales.findIndex(s=>s.id===id);
  const newIdx = idx+direction;
  if(idx<0 || newIdx<0 || newIdx>=sales.length) return;
  [sales[idx], sales[newIdx]] = [sales[newIdx], sales[idx]];
  await persistAll();
  renderVentasTable();
}
async function duplicateSale(id){
  const idx = sales.findIndex(s=>s.id===id);
  if(idx<0) return;
  const original = sales[idx];
  const suggestedPedido = nextId('', sales, 'nPedido').replace(/^0+/,'') || String(sales.length+1);
  const copy = {...original, id: nextId('V', sales, 'id'), nPedido: suggestedPedido, fecha: todayStr()};
  applyStockDelta(copy, -1);
  sales.splice(idx+1, 0, copy);
  await persistAll();
  renderVentasTable();
  renderInventoryTable();
}

  const envio = parseFloat(document.getElementById('v_envio').value)||0;
  const subtotal = cantidad*precioUnitario;
  const total = subtotal - descuento + envio;
  const data = {
    fecha: document.getElementById('v_fecha').value,
    nPedido: document.getElementById('v_pedido').value.trim(),
    cliente: document.getElementById('v_cliente').value.trim(),
    productoId: document.getElementById('v_producto').value,

    metodoPago: document.getElementById('v_metodo').value,

    canal: document.getElementById('v_canal').value,
  };
  if(id){

    applyStockDelta(sales[idx], +1); // revert old
    sales[idx] = {...sales[idx], ...data};
    applyStockDelta(sales[idx], -1); // apply new
  }else{
    const newSale = {id: nextId('V', sales, 'id'), ...data};

  renderVentasTable();

});

function renderResumenVentas(){
  const activas = sales.filter(s=>s.estado!=='Cancelado');
  const totalVendido = activas.reduce((a,s)=>a+s.total,0);
  const pedidos = new Set(activas.map(s=>s.nPedido)).size;
  const unidades = activas.reduce((a,s)=>a+s.cantidad,0);
  const ticketProm = pedidos ? totalVendido/pedidos : 0;

  document.getElementById('statsVentas').innerHTML = `
    <div class="stat"><div class="label">Total vendido</div><div class="value">${fmtMoney(totalVendido)}</div></div>
    <div class="stat"><div class="label">Cantidad de pedidos</div><div class="value">${pedidos}</div></div>
    <div class="stat"><div class="label">Unidades vendidas</div><div class="value">${unidades}</div></div>
    <div class="stat"><div class="label">Ticket promedio</div><div class="value">${fmtMoney(ticketProm)}</div></div>
  `;

  const canales = ['Instagram','WhatsApp','Facebook','Web','Otro'];
  const wrap = document.getElementById('canalTableWrap');
  if(activas.length===0){
    wrap.innerHTML = `<div class="empty-state"><div class="dash">— — —</div>Todavía no hay ventas para mostrar por canal.</div>`;
    return;
  }
  let html = '<table><thead><tr><th>Canal</th><th class="num">Pedidos</th><th class="num">Unidades</th><th class="num">Total vendido</th><th class="num">% del total</th></tr></thead><tbody>';
  canales.forEach(c=>{
    const rows = activas.filter(s=>s.canal===c);
    const ped = new Set(rows.map(s=>s.nPedido)).size;
    const unid = rows.reduce((a,s)=>a+s.cantidad,0);
    const tot = rows.reduce((a,s)=>a+s.total,0);
    const pct = totalVendido ? (tot/totalVendido*100) : 0;
    html += `<tr><td><span class="badge">${c}</span></td><td class="num">${ped}</td><td class="num">${unid}</td><td class="num">${fmtMoney(tot)}</td><td class="num">${pct.toFixed(1)}%</td></tr>`;
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

// ================= RESUMEN GENERAL =================
function renderResumenGeneral(){
  let valorTotalInventario=0, gananciaTotal=0;
  inventory.forEach(p=>{
    const c = computeProduct(p);
    valorTotalInventario += c.valorCostoTotal;
    gananciaTotal += c.gananciaTotalEstimada;
  });
  const modelos = new Set(inventory.map(p=>p.categoria+'|'+p.descripcion)).size;

  document.getElementById('statsGeneral').innerHTML = `
    <div class="stat"><div class="label">Valor total de inventario</div><div class="value">${fmtMoney(valorTotalInventario)}</div></div>
    <div class="stat"><div class="label">Ganancia total estimada</div><div class="value">${fmtMoney(gananciaTotal)}</div></div>
    <div class="stat"><div class="label">Modelos distintos</div><div class="value">${modelos}</div></div>
    <div class="stat"><div class="label">Variantes cargadas</div><div class="value">${inventory.length}</div></div>
  `;

  const catWrap = document.getElementById('categoriaTableWrap');
  if(inventory.length===0){
    catWrap.innerHTML = `<div class="empty-state"><div class="dash">— — —</div>Cargá productos para ver el stock por categoría.</div>`;
  }else{
    let html = '<table><thead><tr><th>Categoría</th><th class="num">Variantes</th><th class="num">Stock total</th><th class="num">Valor inventario</th></tr></thead><tbody>';
    categories.forEach(cat=>{
      const items = inventory.filter(p=>p.categoria===cat);
      if(items.length===0) return;
      const stock = items.reduce((a,p)=>a+p.stockActual,0);
      const valor = items.reduce((a,p)=>a+computeProduct(p).valorCostoTotal,0);
      html += `<tr><td><span class="badge">${esc(cat)}</span></td><td class="num">${items.length}</td><td class="num">${stock}</td><td class="num">${fmtMoney(valor)}</td></tr>`;
    });
    html += '</tbody></table>';
    catWrap.innerHTML = html;
  }

  const lowWrap = document.getElementById('lowStockWrap');
  const low = inventory.filter(p=>p.stockActual<=3).sort((a,b)=>a.stockActual-b.stockActual);
  if(low.length===0){
    lowWrap.innerHTML = `<div class="empty-state"><div class="dash">— — —</div>No hay productos con stock bajo.</div>`;
  }else{
    let html = '<table><thead><tr><th>Producto</th><th>Talle/Color</th><th class="num">Stock</th></tr></thead><tbody>';
    low.forEach(p=>{
      const stockCell = p.stockActual<0 ? `<span class="neg-stock">${p.stockActual}</span>` : `<span class="low-stock">${p.stockActual}</span>`;
      html += `<tr><td>${esc(p.descripcion)}</td><td>${esc(p.talle)} · ${esc(p.color)}</td><td class="num">${stockCell}</td></tr>`;
    });
    html += '</tbody></table>';
    lowWrap.innerHTML = html;
  }
}
